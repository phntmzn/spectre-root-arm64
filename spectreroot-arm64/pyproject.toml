[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectreroot-arm64"
version = "0.1.0"
description = "Read-only macOS security research and forensic analysis helpers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "SpectreRoot contributors" }]
dependencies = []

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
